<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRMANT - Órdenes de Mantenimiento</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="dashboard-container">
    <header class="dashboard-header">
        <img src="/img/airmant.png" alt="Logo AIRMANT" class="logo-img-small">
        <div>
            <h1>Órdenes de Mantenimiento</h1>
            <p class="subtitle">Gestión y seguimiento de órdenes</p>
        </div>
        <a href="/dashboard.html" class="btn btn-secondary">Volver</a>
    </header>

    <section class="dashboard-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <button id="btnNuevaOrden" class="btn btn-primary" style="width:auto;">+ Nueva orden</button>
            <div style="display:flex; gap:10px;">
                <input type="text" id="filtroMatricula" placeholder="Buscar por matrícula">
                <select id="filtroEstado">
                    <option value="">Todos los estados</option>
                    <option value="Abierta">Abierta</option>
                    <option value="En proceso">En proceso</option>
                    <option value="En espera">En espera</option>
                    <option value="Finalizada">Finalizada</option>
                    <option value="Cancelada">Cancelada</option>
                </select>
            </div>
        </div>

        <table class="tabla-aeronaves" id="tablaOrdenes">
            <thead>
            <tr>
                <th>N° Orden</th>
                <th>Aeronave</th>
                <th>Tipo</th>
                <th>Prioridad</th>
                <th>Estado</th>
                <th>Técnico</th>
                <th>Fecha creación</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="cuerpoTablaOrdenes"></tbody>
        </table>
    </section>
</main>

<!-- Modal nueva orden -->
<div id="modalOrden" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <h2>Nueva orden de mantenimiento</h2>
        <form id="formOrden">
            <div class="form-group">
                <label>Aeronave</label>
                <select id="selectAeronave" required></select>
            </div>
            <div id="infoAeronave" style="background:#edf2f7; padding:10px; border-radius:8px; margin-bottom:15px; font-size:13px; display:none;"></div>

            <div class="form-group">
                <label>Técnico responsable</label>
                <select id="selectTecnico" required></select>
            </div>
            <div class="form-group">
                <label>Tipo de mantenimiento</label>
                <select id="tipoMantenimiento" required>
                    <option value="Preventivo">Preventivo</option>
                    <option value="Correctivo">Correctivo</option>
                    <option value="Inspección">Inspección</option>
                </select>
            </div>
            <div class="form-group">
                <label>Prioridad</label>
                <select id="prioridad" required>
                    <option value="Baja">Baja</option>
                    <option value="Media">Media</option>
                    <option value="Alta">Alta</option>
                    <option value="AOG">AOG</option>
                </select>
            </div>
            <div class="form-group">
                <label>Motivo</label>
                <input type="text" id="motivo" required>
            </div>
            <div class="form-group">
                <label>Descripción del trabajo</label>
                <input type="text" id="descripcionTrabajo">
            </div>

            <div style="display:flex; gap:10px; margin-top:15px;">
                <button type="submit" class="btn btn-primary">Crear orden</button>
                <button type="button" id="btnCancelarOrden" class="btn btn-secondary">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/ordenes.js"></script>
</body>
</html>
