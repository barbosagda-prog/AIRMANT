<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRMANT - Insumos</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="dashboard-container" style="max-width:1200px;">
    <header class="dashboard-header">
        <img src="/img/airmant.png" alt="Logo AIRMANT" class="logo-img-small">
        <div>
            <h1>Insumos</h1>
            <p class="subtitle">Catálogo e inventario de consumibles</p>
        </div>
        <a href="/dashboard.html" class="btn btn-secondary">Volver</a>
    </header>

    <section class="dashboard-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
            <button id="btnNuevoInsumo" class="btn btn-primary" style="width:auto;">+ Nuevo insumo</button>
            <div style="display:flex; gap:10px; align-items:center;">
                <span id="contadorAlertas" class="badge-vencer" style="display:none;"></span>
                <button id="btnExportar" class="btn btn-secondary" style="width:auto;">📥 Exportar próximos a vencer</button>
            </div>
        </div>

        <table class="tabla-aeronaves" id="tablaInsumos">
            <thead>
            <tr>
                <th>Código</th>
                <th>Descripción</th>
                <th>Categoría</th>
                <th>Stock</th>
                <th>Unidad</th>
                <th>Proveedor</th>
                <th>Estado</th>
                <th>Vencimiento</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="cuerpoTablaInsumos"></tbody>
        </table>
    </section>
</main>

<!-- Modal nuevo/editar insumo -->
<div id="modalInsumo" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <h2 id="modalTituloInsumo">Nuevo insumo</h2>
        <form id="formInsumo">
            <input type="hidden" id="idInsumo">
            <div class="form-group"><label>Código</label><input type="text" id="codigo" required></div>
            <div class="form-group"><label>Descripción</label><input type="text" id="descripcion" required></div>
            <div class="form-group"><label>Categoría</label><input type="text" id="categoria" required></div>
            <div class="form-group"><label>Cantidad en stock</label><input type="number" id="cantidadStock" required></div>
            <div class="form-group"><label>Unidad de medida</label><input type="text" id="unidadMedida" required></div>
            <div class="form-group"><label>Proveedor</label><input type="text" id="proveedor"></div>
            <div class="form-group"><label>Estado</label><input type="text" id="estado" required></div>
            <div class="form-group"><label>Fecha de vencimiento (opcional)</label><input type="date" id="fechaVencimiento"></div>

            <div style="display:flex; gap:10px; margin-top:15px;">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <button type="button" id="btnCancelarInsumo" class="btn btn-secondary">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/insumos.js"></script>
</body>
</html>
