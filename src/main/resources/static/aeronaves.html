<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRMANT - Aeronaves</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="dashboard-container">
    <header class="dashboard-header">
        <img src="/img/airmant.png" alt="Logo AIRMANT" class="logo-img-small">
        <div>
            <h1>Gestión de Aeronaves</h1>
            <p class="subtitle">Registro y control de flota</p>
        </div>
        <a href="/dashboard.html" class="btn btn-secondary">Volver</a>
    </header>

    <section class="dashboard-content">
        <button id="btnNuevo" class="btn btn-primary" style="width:auto; margin-bottom:20px;">
            + Nueva aeronave
        </button>

        <table class="tabla-aeronaves" id="tablaAeronaves">
            <thead>
            <tr>
                <th>Matrícula</th>
                <th>Fabricante</th>
                <th>Modelo</th>
                <th>Tipo</th>
                <th>Estado</th>
                <th>Horas de vuelo</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </section>
</main>

<!-- Modal formulario -->
<div id="modalForm" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <h2 id="modalTitulo">Nueva aeronave</h2>
        <form id="formAeronave">
            <input type="hidden" id="idAeronave">
            <div class="form-group"><label>Matrícula</label><input type="text" id="matricula" required></div>
            <div class="form-group"><label>Número de serie</label><input type="text" id="numeroSerie" required></div>
            <div class="form-group"><label>Fabricante</label><input type="text" id="fabricante" required></div>
            <div class="form-group"><label>Modelo de fabricación</label><input type="text" id="modeloFabricacion" required></div>
            <div class="form-group"><label>Tipo de aeronave</label><input type="text" id="tipoAeronave" required></div>
            <div class="form-group"><label>Categoría</label><input type="text" id="categoria" required></div>
            <div class="form-group"><label>Tipo de motor</label><input type="text" id="tipoMotor" required></div>
            <div class="form-group"><label>Número de motores</label><input type="number" id="numeroMotor" required></div>
            <div class="form-group"><label>Peso máximo de despegue (kg)</label><input type="number" step="0.01" id="pesoMaximoDespegue" required></div>
            <div class="form-group"><label>Capacidad (pasajeros)</label><input type="number" id="capacidad" required></div>
            <div class="form-group"><label>Configuración de cabina</label><input type="text" id="configuracionCabina" required></div>
            <div class="form-group"><label>Año de fabricación</label><input type="number" id="anioFabricacion" required></div>
            <div class="form-group"><label>Estado</label><input type="text" id="estado" required></div>
            <div class="form-group"><label>Horas de vuelo</label><input type="number" step="0.01" id="horasVuelo" required></div>
            <div class="form-group"><label>Próxima inspección</label><input type="date" id="proximaInspeccion"></div>

            <div style="display:flex; gap:10px; margin-top:15px;">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/aeronaves.js"></script>
</body>
</html>
